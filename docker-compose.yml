services:
  media-monitor:
    build: .
    container_name: media-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount your media directory (read-only recommended)
      - /path/to/your/media:/watch:ro
      # Persistent config and database
      - ./config:/config
    environment:
      # Optional: Override defaults
      - WATCH_DIR=/watch
      - PORT=5000
      - MAX_WORKERS=4
      - STABILIZE_INTERVAL=10
      - STABILIZE_CHECKS=3
      # Size threshold in GB above which a file is flagged RE-ENCODE (default: 20)
      - REENCODE_SIZE_GB=20

      # Optional: Set via environment instead of web UI
      # - NTFY_SERVER=https://ntfy.sh
      # - NTFY_TOPIC=my-media-notifications
      # - DISCORD_WEBHOOK=https://discord.com/api/webhooks/...
      # - TVDB_API_KEY=your-api-key

    # NVIDIA GPU access for hevc_nvenc encoding
    # Requires: NVIDIA Container Toolkit installed on the host
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
